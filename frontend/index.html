<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Connect | Find & Hire Professionals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 60px 20px 40px; color: white; }
        .logo { font-size: 48px; font-weight: 800; margin-bottom: 16px; }
        .logo span { color: #00e8a0; }
        .tagline { font-size: 20px; opacity: 0.9; }
        .auth-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 24px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; padding: 12px; background: none; border: none; font-size: 16px; font-weight: 600; cursor: pointer; color: #64748b; transition: all 0.3s; }
        .tab.active { color: #667eea; border-bottom: 2px solid #667eea; margin-bottom: -2px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b; }
        input, select { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; display: none; z-index: 1000; }
        .demo-credentials { margin-top: 20px; padding: 15px; background: #f1f5f9; border-radius: 12px; font-size: 13px; text-align: center; }
        .demo-credentials p { margin: 5px 0; color: #64748b; }
        .demo-credentials strong { color: #1e293b; }
        @media (max-width: 768px) { .auth-container { margin: 20px; padding: 30px; } .logo { font-size: 36px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Service<span>Connect</span></div>
            <div class="tagline">Connect with trusted professionals • Get work done • Grow your business</div>
        </div>
        
        <div class="auth-container">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Login</button>
                <button class="tab" onclick="switchTab('register')">Register</button>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="login()">Login →</button>
                <div id="loginError" style="color: red; font-size: 13px; margin-top: 10px; text-align: center;"></div>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regFullName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="+233 XX XXX XXXX">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="regLocation" placeholder="Accra, Ghana">
                </div>
                <div class="form-group">
                    <label>I am a...</label>
                    <select id="regUserType">
                        <option value="seeker">📋 Customer - Looking for services</option>
                        <option value="provider">🔧 Provider - Offering services</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="register()">Create Account →</button>
                <div id="registerError" style="color: red; font-size: 13px; margin-top: 10px; text-align: center;"></div>
            </div>
            
            <div class="demo-credentials">
                <p><strong>📝 Demo Credentials (after setup):</strong></p>
                <p>🔑 Admin: admin@serviceconnect.com / password123</p>
                <p>👤 Seeker: seeker@test.com / password123</p>
                <p>🔧 Provider: provider@test.com / password123</p>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        const API_URL = '';
        
        function switchTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('loginError').innerHTML = '';
            document.getElementById('registerError').innerHTML = '';
        }
        
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!email || !password) {
                errorDiv.innerHTML = 'Please fill in all fields';
                return;
            }
            
            errorDiv.innerHTML = 'Logging in...';
            
            try {
                const response = await fetch(API_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        if (data.user.user_type === 'seeker') {
                            window.location.href = 'seeker-dashboard.html';
                        } else if (data.user.user_type === 'provider') {
                            window.location.href = 'provider-dashboard.html';
                        } else if (data.user.user_type === 'admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    errorDiv.innerHTML = data.message || 'Invalid email or password';
                    showToast(data.message || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.innerHTML = 'Connection error. Please try again.';
                showToast('Connection error', 'error');
            }
        }
        
        async function register() {
            const full_name = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const location = document.getElementById('regLocation').value;
            const user_type = document.getElementById('regUserType').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            
            if (!full_name || !email || !password) {
                errorDiv.innerHTML = 'Please fill all required fields';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.innerHTML = 'Passwords do not match';
                return;
            }
            
            if (password.length < 4) {
                errorDiv.innerHTML = 'Password must be at least 4 characters';
                return;
            }
            
            errorDiv.innerHTML = 'Creating account...';
            
            try {
                const response = await fetch(API_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, phone, location, user_type, password })
                });
                
                const data = await response.json();
                console.log('Register response:', data);
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Registration successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        if (data.user.user_type === 'seeker') {
                            window.location.href = 'seeker-dashboard.html';
                        } else if (data.user.user_type === 'provider') {
                            window.location.href = 'provider-dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    errorDiv.innerHTML = data.message || 'Registration failed';
                    showToast(data.message || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Register error:', error);
                errorDiv.innerHTML = 'Connection error. Please try again.';
                showToast('Connection error', 'error');
            }
        }
        
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
