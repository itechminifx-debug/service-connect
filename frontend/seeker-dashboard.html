<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker Dashboard | Service Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1e293b; }
        .navbar { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: #00c8ff; }
        .nav-links { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .nav-link { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: background 0.3s; cursor: pointer; }
        .nav-link:hover { background: rgba(255, 255, 255, 0.1); }
        .nav-link.active { background: linear-gradient(135deg, #f59e0b, #e67e22); color: white; }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: rgba(255, 255, 255, 0.2); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .welcome-card { background: linear-gradient(135deg, #f59e0b, #e67e22); border-radius: 24px; padding: 30px; color: white; margin-bottom: 30px; }
        .welcome-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-info h4 { font-size: 13px; color: #64748b; margin-bottom: 8px; }
        .stat-number { font-size: 28px; font-weight: 700; color: #1e293b; }
        .stat-icon { font-size: 40px; opacity: 0.5; }
        .tabs { display: flex; gap: 12px; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; flex-wrap: wrap; }
        .tab { padding: 10px 24px; background: none; border: none; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.3s; }
        .tab.active { background: linear-gradient(135deg, #f59e0b, #e67e22); color: white; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
        .job-card, .bid-card, .hire-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .job-card:hover, .bid-card:hover, .hire-card:hover { transform: translateY(-3px); }
        .job-category { display: inline-block; background: rgba(0, 200, 255, 0.1); color: #00c8ff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 12px; }
        .job-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .job-details { font-size: 14px; color: #64748b; margin-bottom: 15px; line-height: 1.5; }
        .job-budget { font-weight: 700; color: #f59e0b; margin-bottom: 15px; }
        .bid-amount { font-weight: 700; color: #10b981; font-size: 18px; margin-bottom: 10px; }
        .bid-provider { font-weight: 600; margin-bottom: 5px; }
        .accept-btn { background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .review-btn { background: linear-gradient(135deg, #f59e0b, #e67e22); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .post-job-form { background: white; border-radius: 20px; padding: 25px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #f59e0b, #e67e22); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .badge-pending { background: #fef3c7; color: #d97706; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .badge-accepted { background: #dcfce7; color: #16a34a; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .badge-completed { background: #dbeafe; color: #2563eb; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .empty-state { text-align: center; padding: 60px; color: #94a3b8; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; display: none; z-index: 1000; }
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .button-group button { flex: 1; margin-top: 0; }
        .rating-stars { display: inline-flex; align-items: center; gap: 2px; margin-left: 10px; }
        .rating-stars i { color: #f59e0b; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%; }
        .star { font-size: 40px; cursor: pointer; color: #cbd5e1; transition: color 0.2s; }
        .star.selected { color: #f59e0b; }
        @media (max-width: 768px) { .navbar { flex-direction: column; text-align: center; } .cards-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links">
            <a href="#" class="nav-link active">📋 My Dashboard</a>
            <a href="#" class="nav-link" onclick="window.location.href='marketplace.html'">🛒 Marketplace</a>
            <a href="chat.html" class="nav-link">💬 Messages</a>
        </div>
        <div class="user-info">
            <span class="user-name" id="userName">Customer</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <div class="welcome-title">Find Trusted Professionals, <span id="seekerName">Customer</span>!</div>
            <div class="welcome-text">Post a job, browse the marketplace, or track your hires.</div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="post-job-form">
            <div class="form-title">📝 Post a New Job</div>
            <div class="form-row">
                <select id="jobCategory" class="form-select"><option value="">Select Category</option></select>
                <input type="text" id="jobTitle" class="form-input" placeholder="Job Title">
            </div>
            <div class="form-row"><textarea id="jobDescription" class="form-textarea" rows="4" placeholder="Describe the job..."></textarea></div>
            <div class="form-row">
                <input type="number" id="jobBudget" class="form-input" placeholder="Budget (GHS)">
                <input type="text" id="jobLocation" class="form-input" placeholder="Location">
                <input type="date" id="jobDate" class="form-input">
            </div>
            <button class="btn-primary" onclick="postJob()">Post Job →</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('postedJobs')">📋 My Posted Jobs</button>
            <button class="tab" onclick="showTab('directHires')">🔄 Direct Hires</button>
            <button class="tab" onclick="showTab('bids')">📩 Received Bids</button>
        </div>

        <div id="postedJobs" class="cards-grid"></div>
        <div id="directHires" style="display: none;" class="cards-grid"></div>
        <div id="bids" style="display: none;" class="cards-grid"></div>
    </div>

    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:20px;">⭐ Rate Your Experience</h3>
            <p style="margin-bottom:15px;">How was your experience with <strong id="reviewProviderName"></strong>?</p>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
                <span class="star" data-rating="1" onclick="setRating(1)">☆</span>
                <span class="star" data-rating="2" onclick="setRating(2)">☆</span>
                <span class="star" data-rating="3" onclick="setRating(3)">☆</span>
                <span class="star" data-rating="4" onclick="setRating(4)">☆</span>
                <span class="star" data-rating="5" onclick="setRating(5)">☆</span>
            </div>
            <textarea id="reviewComment" rows="4" placeholder="Write your review here (optional)..." style="width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:12px; margin-bottom:20px;"></textarea>
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" style="flex:1;" onclick="submitReview()">Submit Review</button>
                <button class="accept-btn" style="flex:1; background:#64748b;" onclick="closeReviewModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        let categories = [];
        let currentReviewJobId = null;
        let currentReviewRevieweeId = null;
        let currentRating = 0;

        if (!token) window.location.href = 'index.html';
        try {
            user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('userName').innerText = user?.full_name || 'Customer';
            document.getElementById('seekerName').innerText = user?.full_name?.split(' ')[0] || 'Customer';
        } catch(e) {}

        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers } });
            return response.json();
        }

        async function loadCategories() {
            categories = await apiCall('/api/categories');
            document.getElementById('jobCategory').innerHTML = '<option value="">Select Category</option>' + categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
        }

        async function loadDashboard() { await loadPostedJobs(); await loadDirectHires(); await loadBids(); await loadStats(); }

        async function postJob() {
            const category_id = document.getElementById('jobCategory').value;
            const title = document.getElementById('jobTitle').value;
            const description = document.getElementById('jobDescription').value;
            if (!category_id || !title || !description) { showToast('Fill category, title, and description', 'error'); return; }
            const result = await apiCall('/api/jobs', { method: 'POST', body: JSON.stringify({ category_id, title, description, budget: document.getElementById('jobBudget').value, location: document.getElementById('jobLocation').value, preferred_date: document.getElementById('jobDate').value }) });
            if (result.success) { showToast('Job posted!', 'success'); document.getElementById('jobTitle').value = ''; document.getElementById('jobDescription').value = ''; document.getElementById('jobBudget').value = ''; document.getElementById('jobLocation').value = ''; document.getElementById('jobDate').value = ''; loadPostedJobs(); loadStats(); }
            else { showToast(result.message || 'Failed', 'error'); }
        }

        function renderStars(rating) {
            if (!rating || rating === 0) return '<span style="color:#cbd5e1;">★★★★★</span> <span style="font-size:12px;">No reviews</span>';
            const fullStars = Math.floor(rating);
            let stars = '';
            for (let i = 0; i < fullStars; i++) stars += '<i class="fas fa-star"></i>';
            for (let i = 0; i < 5 - fullStars; i++) stars += '<i class="far fa-star"></i>';
            return `${stars} <span style="font-size:12px;">${rating.toFixed(1)}</span>`;
        }

        async function loadPostedJobs() {
            const jobs = await apiCall('/api/jobs/my');
            const container = document.getElementById('postedJobs');
            if (!jobs || jobs.length === 0) { container.innerHTML = '<div class="empty-state">📋 No jobs posted yet. Post your first job above!</div>'; return; }
            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <span class="job-category">${getCategoryIcon(job.category_name)} ${job.category_name}</span>
                    <div class="job-title">${escapeHtml(job.title)}</div>
                    <div class="job-details">${escapeHtml(job.description?.substring(0, 120) || '')}${job.description?.length > 120 ? '...' : ''}</div>
                    <div class="job-budget">💰 Budget: GHS ${job.budget || 'Negotiable'}</div>
                    <div class="job-details">📍 ${job.location || 'Location not specified'} | 👁️ ${job.views || 0} views</div>
                    <div class="job-details">Status: ${job.status === 'open' ? '<span class="badge-pending">🟢 Open</span>' : job.status === 'assigned' ? '<span class="badge-accepted">🟡 Assigned</span>' : '<span class="badge-completed">🔵 Completed</span>'}</div>
                    ${job.status === 'open' ? `<button class="accept-btn" onclick="viewBids(${job.id})" style="background:#3b82f6;">View Bids (${job.bid_count || 0})</button>` : ''}
                </div>
            `).join('');
        }

        async function loadDirectHires() {
            const hires = await apiCall('/api/seeker/direct-hires');
            const container = document.getElementById('directHires');
            if (!hires || hires.length === 0) { container.innerHTML = '<div class="empty-state">🔄 No direct hires yet. Browse the Marketplace to hire providers directly!</div>'; return; }
            container.innerHTML = hires.map(hire => `
                <div class="hire-card">
                    <span class="job-category">🛒 Direct Hire</span>
                    <div class="job-title">${escapeHtml(hire.service_title)}</div>
                    <div class="job-details">Provider: ${escapeHtml(hire.provider_name)} ${renderStars(hire.provider_rating)}</div>
                    <div class="job-budget">💰 Amount: GHS ${hire.agreed_amount}</div>
                    <div class="job-details">📝 "${escapeHtml(hire.message || 'No message')}"</div>
                    <div class="job-details">Status: ${hire.status === 'pending' ? '<span class="badge-pending">⏳ Pending Provider Response</span>' : hire.status === 'accepted' ? '<span class="badge-accepted">✅ Accepted - In Progress</span>' : '<span class="badge-completed">❌ Declined</span>'}</div>
                    <div class="job-details">📅 Hired on: ${new Date(hire.created_at).toLocaleDateString()}</div>
                    ${hire.status === 'completed' && !hire.reviewed ? `<button class="review-btn" onclick="openReviewModal(${hire.id}, ${hire.provider_id}, '${escapeHtml(hire.provider_name)}')">⭐ Leave Review</button>` : ''}
                </div>
            `).join('');
        }

        async function loadBids() {
            const myJobs = await apiCall('/api/jobs/my');
            let allBids = [];
            for (const job of myJobs) {
                const bids = await apiCall(`/api/jobs/${job.id}/bids`);
                if (bids && bids.length > 0) allBids.push(...bids.map(bid => ({ ...bid, job_title: job.title, job_id: job.id, job_budget: job.budget })));
            }
            const container = document.getElementById('bids');
            if (allBids.length === 0) { container.innerHTML = '<div class="empty-state">📩 No bids received yet. Post a job to receive bids from providers!</div>'; return; }
            container.innerHTML = allBids.map(bid => `
                <div class="bid-card">
                    <span class="job-category">📝 Bid Received</span>
                    <div class="job-title">${escapeHtml(bid.job_title)}</div>
                    <div class="bid-provider">Provider: ${escapeHtml(bid.provider_name)} ${renderStars(bid.provider_rating)}</div>
                    <div class="bid-amount">💰 Bid: GHS ${bid.amount}</div>
                    <div class="job-details">⏱️ ${bid.estimated_days} day(s) | 📝 "${escapeHtml(bid.message || 'No message')}"</div>
                    <div class="job-details">Your Budget: GHS ${bid.job_budget || 'Negotiable'}</div>
                    ${bid.status === 'pending' ? `<button class="accept-btn" onclick="acceptBid(${bid.id}, ${bid.job_id}, ${bid.amount})">Accept Bid (GHS ${bid.amount})</button>` : `<div class="job-details">Status: ${bid.status === 'accepted' ? '<span class="badge-accepted">✅ Accepted</span>' : '<span class="badge-pending">⏳ Pending</span>'}</div>`}
                </div>
            `).join('');
        }

        async function acceptBid(bidId, jobId, amount) {
            if (confirm(`Accept this bid of GHS ${amount}?`)) {
                const result = await apiCall(`/api/bids/${bidId}/accept`, { method: 'PUT' });
                if (result.success) { showToast('Bid accepted! Provider notified.', 'success'); loadPostedJobs(); loadBids(); loadStats(); }
                else { showToast(result.message || 'Failed', 'error'); }
            }
        }

        async function loadStats() {
            const postedJobs = await apiCall('/api/jobs/my');
            const directHires = await apiCall('/api/seeker/direct-hires');
            const stats = await apiCall('/api/dashboard/stats');
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-info"><h4>Jobs Posted</h4><div class="stat-number">${postedJobs?.length || 0}</div></div><div class="stat-icon">📋</div></div>
                <div class="stat-card"><div class="stat-info"><h4>Direct Hires</h4><div class="stat-number">${directHires?.length || 0}</div></div><div class="stat-icon">🛒</div></div>
                <div class="stat-card"><div class="stat-info"><h4>Bids Received</h4><div class="stat-number">${stats.total_bids_received || 0}</div></div><div class="stat-icon">📝</div></div>
                <div class="stat-card"><div class="stat-info"><h4>Completed</h4><div class="stat-number">${stats.completed_jobs || 0}</div></div><div class="stat-icon">✅</div></div>
            `;
        }

        function getCategoryIcon(name) {
            const icons = { 'Plumbing':'🔧','Electrical':'⚡','Cleaning':'🧹','Tutoring':'📚','Computer Repair':'💻','Photography':'📸','Driving':'🚗','Catering':'🍳','Construction':'🏗️','Painting':'🎨' };
            return icons[name] || '🔧';
        }

        function viewBids(jobId) { showTab('bids'); showToast(`Viewing bids for job #${jobId}`, 'info'); }
        
        function showTab(tab) {
            document.getElementById('postedJobs').style.display = tab === 'postedJobs' ? 'grid' : 'none';
            document.getElementById('directHires').style.display = tab === 'directHires' ? 'grid' : 'none';
            document.getElementById('bids').style.display = tab === 'bids' ? 'grid' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'bids') loadBids();
            if (tab === 'directHires') loadDirectHires();
        }

        function openReviewModal(jobId, revieweeId, providerName) {
            currentReviewJobId = jobId;
            currentReviewRevieweeId = revieweeId;
            currentRating = 0;
            document.getElementById('reviewProviderName').innerText = providerName;
            document.getElementById('reviewComment').value = '';
            document.querySelectorAll('.star').forEach(star => { star.classList.remove('selected'); star.innerText = '☆'; });
            document.getElementById('reviewModal').style.display = 'flex';
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < rating) { star.classList.add('selected'); star.innerText = '★'; }
                else { star.classList.remove('selected'); star.innerText = '☆'; }
            });
        }

        async function submitReview() {
            if (currentRating === 0) { showToast('Please select a rating', 'error'); return; }
            const comment = document.getElementById('reviewComment').value;
            showToast('Submitting review...', 'info');
            const result = await apiCall('/api/reviews', { method: 'POST', body: JSON.stringify({ job_id: currentReviewJobId, reviewee_id: currentReviewRevieweeId, rating: currentRating, comment: comment }) });
            if (result.success) { showToast('⭐ Review submitted successfully!', 'success'); closeReviewModal(); loadDirectHires(); }
            else { showToast(result.message || 'Failed to submit review', 'error'); }
        }

        function closeReviewModal() { document.getElementById('reviewModal').style.display = 'none'; currentReviewJobId = null; currentReviewRevieweeId = null; currentRating = 0; }

        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

        loadCategories(); loadDashboard();
    </script>
</body>
</html>
