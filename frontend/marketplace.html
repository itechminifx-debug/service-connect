<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Service Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1e293b; }
        .navbar { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: #00c8ff; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: background 0.3s; cursor: pointer; }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .filters { background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .filter-select, .filter-input { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; flex: 1; min-width: 150px; }
        .search-btn { background: linear-gradient(135deg, #00c8ff, #00e8a0); border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; color: #0f0c29; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 20px; padding: 20px; transition: transform 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .service-card:hover { transform: translateY(-3px); }
        .service-category { display: inline-block; background: rgba(0,200,255,0.1); color: #00c8ff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 12px; }
        .job-badge { background: #f59e0b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; margin-left: 8px; }
        .service-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .provider-name { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .service-price { font-weight: 700; color: #f59e0b; font-size: 20px; margin: 10px 0; }
        .hire-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .bid-btn { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .profile-link { display: inline-block; margin-top: 10px; color: #8b5cf6; text-decoration: none; font-size: 13px; font-weight: 500; }
        .profile-link:hover { text-decoration: underline; }
        .rating-stars { margin: 8px 0; }
        .rating-stars i { color: #f59e0b; font-size: 14px; }
        .rating-text { font-size: 13px; color: #64748b; margin-left: 5px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; display: none; z-index: 1000; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; }
        .empty-state { text-align: center; padding: 60px; color: #94a3b8; }
        .info-banner { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .my-service-badge { display: inline-block; background: #8b5cf6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; margin-left: 10px; }
        .loading-spinner { text-align: center; padding: 60px; }
        .loading-spinner i { font-size: 40px; color: #00c8ff; }
        @media (max-width: 768px) { .navbar { flex-direction: column; } .services-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links">
            <a href="#" id="dashboardLink" class="nav-link">📋 Dashboard</a>
            <a href="#" class="nav-link active">🛒 Marketplace</a>
            <a href="chat.html" class="nav-link">💬 Messages</a>
        </div>
        <div class="user-info">
            <span id="userName">User</span>
            <span id="userTypeBadge" style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px;"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div id="providerBanner" class="info-banner" style="display: none;">
            <i class="fas fa-info-circle"></i> You are viewing as a <strong>Provider</strong>. You can only see and manage your own services here.
        </div>
        
        <div id="seekerBanner" class="info-banner" style="display: none; background: linear-gradient(135deg, #10b981, #059669);">
            <i class="fas fa-info-circle"></i> You are viewing as a <strong>Customer (Seeker)</strong>. Browse all services and hire providers directly.
        </div>

        <div class="filters">
            <select id="categoryFilter" class="filter-select"><option value="">All Categories</option></select>
            <input type="text" id="locationFilter" class="filter-input" placeholder="Location">
            <input type="number" id="minPrice" class="filter-input" placeholder="Min Price">
            <input type="number" id="maxPrice" class="filter-input" placeholder="Max Price">
            <button class="search-btn" onclick="loadServices()">🔍 Search</button>
        </div>
        
        <div id="servicesGrid" class="services-grid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading services...</p>
            </div>
        </div>
    </div>

    <!-- Hire Modal (Only for Seekers - Services) -->
    <div id="hireModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:20px;">📝 Hire Provider</h3>
            <input type="number" id="hireAmount" placeholder="Agreed Amount (GHS)">
            <textarea id="hireMessage" rows="3" placeholder="Message to provider..."></textarea>
            <button class="hire-btn" onclick="confirmHire()">Send Hire Request</button>
            <button onclick="closeHireModal()" style="margin-top:10px; width:100%; padding:12px; background:#e2e8f0; border:none; border-radius:12px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <!-- Bid Modal (For Jobs posted by Admin) -->
    <div id="bidModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:20px;">💰 Place Bid on Job</h3>
            <input type="number" id="bidAmount" placeholder="Your bid amount (GHS) *">
            <input type="number" id="bidDays" placeholder="Estimated days to complete">
            <textarea id="bidMessage" rows="3" placeholder="Message to client..."></textarea>
            <button class="bid-btn" onclick="confirmBid()">Submit Bid</button>
            <button onclick="closeBidModal()" style="margin-top:10px; width:100%; padding:12px; background:#e2e8f0; border:none; border-radius:12px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        let selectedItem = null;
        
        if (!token) window.location.href = 'index.html';
        
        try { 
            user = JSON.parse(localStorage.getItem('user')); 
            document.getElementById('userName').innerText = user?.full_name || 'User';
            document.getElementById('userTypeBadge').innerText = user?.user_type === 'seeker' ? 'Customer' : 'Provider';
            
            const dashboardLink = document.getElementById('dashboardLink');
            if (user?.user_type === 'seeker') {
                dashboardLink.href = 'seeker-dashboard.html';
                document.getElementById('seekerBanner').style.display = 'block';
            } else {
                dashboardLink.href = 'provider-dashboard.html';
                document.getElementById('providerBanner').style.display = 'block';
            }
        } catch(e) {}
        
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers } });
            return response.json();
        }
        
        async function loadCategories() {
            try {
                const categories = await apiCall('/api/categories');
                const select = document.getElementById('categoryFilter');
                if (categories && categories.length > 0) {
                    const uniqueCategories = [];
                    const names = new Set();
                    for (const cat of categories) {
                        if (!names.has(cat.name)) {
                            names.add(cat.name);
                            uniqueCategories.push(cat);
                        }
                    }
                    select.innerHTML = '<option value="">All Categories</option>' + uniqueCategories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        function renderStars(rating) {
            const numRating = parseFloat(rating) || 0;
            if (numRating === 0) {
                return '<i class="far fa-star" style="color:#cbd5e1;"></i><i class="far fa-star" style="color:#cbd5e1;"></i><i class="far fa-star" style="color:#cbd5e1;"></i><i class="far fa-star" style="color:#cbd5e1;"></i><i class="far fa-star" style="color:#cbd5e1;"></i> <span class="rating-text">No reviews yet</span>';
            }
            const fullStars = Math.floor(numRating);
            const halfStar = numRating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) stars += '<i class="fas fa-star"></i>';
            if (halfStar) stars += '<i class="fas fa-star-half-alt"></i>';
            for (let i = 0; i < 5 - fullStars - (halfStar ? 1 : 0); i++) stars += '<i class="far fa-star"></i>';
            return `${stars} <span class="rating-text">${numRating.toFixed(1)}</span>`;
        }
        
        async function loadServices() {
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            
            let url = '/api/services/marketplace?';
            if (category) url += `category=${category}&`;
            if (location) url += `location=${location}&`;
            if (minPrice) url += `min_price=${minPrice}&`;
            if (maxPrice) url += `max_price=${maxPrice}&`;
            
            const items = await apiCall(url);
            const container = document.getElementById('servicesGrid');
            
            if (!items || items.length === 0) { 
                container.innerHTML = '<div class="empty-state">No services or jobs found. Try different filters!</div>'; 
                return; 
            }
            
            // PROVIDER VIEW - Only show their own services
            if (user?.user_type === 'provider') {
                const myServices = items.filter(s => s.provider_id === user.id && s.item_type !== 'job');
                
                if (myServices.length === 0) {
                    container.innerHTML = '<div class="empty-state">🔧 You haven\'t added any services yet. Go to your Dashboard → My Services to add your first service!</div>';
                    return;
                }
                
                container.innerHTML = myServices.map(service => `
                    <div class="service-card" style="border: 2px solid #8b5cf6;">
                        <span class="service-category">${service.category_icon} ${service.category_name}</span>
                        <span class="my-service-badge"><i class="fas fa-user-check"></i> Your Service</span>
                        <div class="service-title">${escapeHtml(service.title)}</div>
                        <div class="service-price">💰 GHS ${service.price || 'Negotiable'} ${service.price_type === 'hourly' ? '/hour' : ''}</div>
                        <div class="service-details" style="font-size:13px; color:#64748b; margin-bottom:10px;">${escapeHtml(service.description?.substring(0, 100) || '')}</div>
                        <a href="provider-profile.html?id=${service.provider_id}" class="profile-link"><i class="fas fa-external-link-alt"></i> View My Public Profile</a>
                        <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #e2e8f0; text-align: center; color: #8b5cf6; font-size: 12px;">
                            <i class="fas fa-info-circle"></i> To edit or delete this service, go to Dashboard → My Services
                        </div>
                    </div>
                `).join('');
                return;
            }
            
            // SEEKER VIEW - Show ALL services AND jobs
            container.innerHTML = items.map(item => {
                if (item.item_type === 'job') {
                    // Display as JOB (from admin posts)
                    const ratingValue = item.provider_rating ? parseFloat(item.provider_rating).toFixed(1) : 'New';
                    return `
                        <div class="service-card" style="border: 2px solid #f59e0b;">
                            <span class="service-category">
                                📋 JOB POST ${item.category_icon} ${item.category_name}
                                <span class="job-badge">Posted by Admin</span>
                            </span>
                            <div class="service-title">${escapeHtml(item.title)}</div>
                            <div class="provider-name">
                                <i class="fas fa-building"></i> Provider: ${escapeHtml(item.provider_name || 'Service Connect')}
                            </div>
                            <div class="provider-name"><i class="fas fa-map-marker-alt"></i> 📍 ${escapeHtml(item.provider_location || 'Location specified')}</div>
                            <div class="service-price">💰 Budget: GHS ${item.price || 'Negotiable'}</div>
                            <div class="service-details" style="font-size:13px; color:#64748b; margin-bottom:10px;">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                            <button class="bid-btn" onclick="openBidModal(${item.id}, '${escapeHtml(item.title)}')">💰 Place Bid</button>
                        </div>
                    `;
                } else {
                    // Display as SERVICE (from providers)
                    const ratingValue = item.provider_rating ? parseFloat(item.provider_rating).toFixed(1) : 'New';
                    return `
                        <div class="service-card">
                            <span class="service-category">🔧 SERVICE ${item.category_icon} ${item.category_name}</span>
                            <div class="service-title">${escapeHtml(item.title)}</div>
                            <div class="provider-name">
                                <i class="fas fa-user"></i> 
                                <a href="provider-profile.html?id=${item.provider_id}" style="color: #8b5cf6; text-decoration: none; font-weight: 500;">${escapeHtml(item.provider_name)}</a>
                                <span style="font-size:12px; color:#64748b; margin-left:5px;">⭐ ${ratingValue}</span>
                            </div>
                            <div class="rating-stars">${renderStars(item.provider_rating)}</div>
                            <div class="provider-name"><i class="fas fa-map-marker-alt"></i> 📍 ${item.provider_location || 'Location not specified'}</div>
                            <div class="service-price">💰 GHS ${item.price || 'Negotiable'} ${item.price_type === 'hourly' ? '/hour' : ''}</div>
                            <div class="service-details" style="font-size:13px; color:#64748b; margin-bottom:10px;">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                            <button class="hire-btn" onclick="openHireModal(${item.id}, ${item.provider_id}, '${escapeHtml(item.title)}')">📞 Hire Now</button>
                            <a href="provider-profile.html?id=${item.provider_id}" class="profile-link"><i class="fas fa-user-circle"></i> View Full Profile →</a>
                        </div>
                    `;
                }
            }).join('');
        }
        
        // For hiring a service (provider service)
        function openHireModal(serviceId, providerId, serviceTitle) {
            if (user?.user_type === 'provider') {
                showToast('Providers cannot hire services. This feature is for customers only.', 'error');
                return;
            }
            selectedItem = { type: 'service', id: serviceId, providerId: providerId, title: serviceTitle };
            document.getElementById('hireAmount').value = '';
            document.getElementById('hireMessage').value = '';
            document.getElementById('hireModal').style.display = 'flex';
        }
        
        function closeHireModal() {
            document.getElementById('hireModal').style.display = 'none';
        }
        
        async function confirmHire() {
            if (user?.user_type === 'provider') {
                showToast('Providers cannot hire services.', 'error');
                closeHireModal();
                return;
            }
            
            const amount = document.getElementById('hireAmount').value;
            const message = document.getElementById('hireMessage').value;
            if (!amount || amount <= 0) { showToast('Please enter a valid amount', 'error'); return; }
            
            const result = await apiCall('/api/direct-hire', { 
                method: 'POST', 
                body: JSON.stringify({ 
                    service_id: selectedItem.id, 
                    provider_id: selectedItem.providerId, 
                    agreed_amount: parseFloat(amount), 
                    message: message 
                }) 
            });
            
            if (result.success) { 
                showToast('Hire request sent successfully!', 'success'); 
                closeHireModal(); 
            } else { 
                showToast(result.message || 'Failed to send hire request', 'error'); 
            }
        }
        
        // For bidding on a job (admin-posted job)
        let currentJobId = null;
        
        function openBidModal(jobId, jobTitle) {
            if (user?.user_type !== 'seeker') {
                showToast('Only seekers can place bids on jobs', 'error');
                return;
            }
            currentJobId = jobId;
            document.getElementById('bidAmount').value = '';
            document.getElementById('bidDays').value = '';
            document.getElementById('bidMessage').value = '';
            document.getElementById('bidModal').style.display = 'flex';
        }
        
        function closeBidModal() {
            document.getElementById('bidModal').style.display = 'none';
            currentJobId = null;
        }
        
        async function confirmBid() {
            const amount = document.getElementById('bidAmount').value;
            const days = document.getElementById('bidDays').value;
            const message = document.getElementById('bidMessage').value;
            
            if (!amount || amount <= 0) {
                showToast('Please enter a valid bid amount', 'error');
                return;
            }
            
            const result = await apiCall(`/api/jobs/${currentJobId}/bids`, {
                method: 'POST',
                body: JSON.stringify({ 
                    amount: parseFloat(amount), 
                    estimated_days: days || 1,
                    message: message 
                })
            });
            
            if (result.success) {
                showToast('Bid placed successfully! The job poster will review your bid.', 'success');
                closeBidModal();
            } else {
                showToast(result.message || 'Failed to place bid', 'error');
            }
        }
        
        function showToast(msg, type) { 
            const t = document.getElementById('toast'); 
            t.textContent = msg; 
            t.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981'; 
            t.style.display = 'block'; 
            setTimeout(() => t.style.display = 'none', 3000); 
        }
        
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        function escapeHtml(str) { 
            if (!str) return ''; 
            return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); 
        }
        
        // Initialize
        loadCategories(); 
        loadServices();
        
        // Refresh every 30 seconds
        setInterval(loadServices, 30000);
    </script>
</body>
</html>
