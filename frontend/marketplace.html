<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Service Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1e293b; }
        .navbar { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: #00c8ff; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: background 0.3s; cursor: pointer; }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .filters { background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .filter-select, .filter-input { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; flex: 1; min-width: 150px; }
        .search-btn { background: linear-gradient(135deg, #00c8ff, #00e8a0); border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; color: #0f0c29; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 20px; padding: 20px; transition: transform 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .service-card:hover { transform: translateY(-3px); }
        .service-category { display: inline-block; background: rgba(0,200,255,0.1); color: #00c8ff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 12px; }
        .service-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .provider-name { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .service-price { font-weight: 700; color: #f59e0b; font-size: 20px; margin: 10px 0; }
        .hire-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; display: none; z-index: 1000; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; }
        .empty-state { text-align: center; padding: 60px; color: #94a3b8; }
        @media (max-width: 768px) { .navbar { flex-direction: column; } .services-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links">
            <a href="seeker-dashboard.html" class="nav-link">📋 Dashboard</a>
            <a href="#" class="nav-link active">🛒 Marketplace</a>
            <a href="chat.html" class="nav-link">💬 Messages</a>
        </div>
        <div class="user-info">
            <span id="userName">Customer</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="filters">
            <select id="categoryFilter" class="filter-select"><option value="">All Categories</option></select>
            <input type="text" id="locationFilter" class="filter-input" placeholder="Location">
            <input type="number" id="minPrice" class="filter-input" placeholder="Min Price">
            <input type="number" id="maxPrice" class="filter-input" placeholder="Max Price">
            <button class="search-btn" onclick="loadServices()">🔍 Search</button>
        </div>
        
        <div id="servicesGrid" class="services-grid"><div class="empty-state" style="text-align:center; padding:60px;">Loading services...</div></div>
    </div>

    <div id="hireModal" class="modal"><div class="modal-content"><h3 style="margin-bottom:20px;">📝 Hire Provider</h3><input type="number" id="hireAmount" placeholder="Agreed Amount (GHS)"><textarea id="hireMessage" rows="3" placeholder="Message to provider..."></textarea><button class="hire-btn" onclick="confirmHire()">Send Hire Request</button><button onclick="closeModal()" style="margin-top:10px; width:100%; padding:12px; background:#e2e8f0; border:none; border-radius:12px; cursor:pointer;">Cancel</button></div></div>
    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        let selectedService = null;
        
        if (!token) window.location.href = 'index.html';
        try { 
            user = JSON.parse(localStorage.getItem('user')); 
            document.getElementById('userName').innerText = user?.full_name || 'Customer';
            
            // IMPORTANT: Redirect PROVIDERS away from marketplace
            if (user && user.user_type === 'provider') {
                window.location.href = 'provider-dashboard.html';
            }
        } catch(e) {}
        
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers } });
            return response.json();
        }
        
        async function loadCategories() {
            const categories = await apiCall('/api/categories');
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="">All Categories</option>' + categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
        }
        
        async function loadServices() {
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            
            let url = '/api/services/marketplace?';
            if (category) url += `category=${category}&`;
            if (location) url += `location=${location}&`;
            if (minPrice) url += `min_price=${minPrice}&`;
            if (maxPrice) url += `max_price=${maxPrice}&`;
            
            const services = await apiCall(url);
            const container = document.getElementById('servicesGrid');
            
            if (!services || services.length === 0) { container.innerHTML = '<div class="empty-state">No services found. Try different filters!</div>'; return; }
            
            container.innerHTML = services.map(service => `
                <div class="service-card">
                    <span class="service-category">${service.category_icon} ${service.category_name}</span>
                    <div class="service-title">${escapeHtml(service.title)}</div>
                    <div class="provider-name"><i class="fas fa-user"></i> ${escapeHtml(service.provider_name)}</div>
                    <div class="provider-name"><i class="fas fa-map-marker-alt"></i> ${service.provider_location || 'Location not specified'}</div>
                    <div class="service-price">💰 GHS ${service.price || 'Negotiable'} ${service.price_type === 'hourly' ? '/hour' : ''}</div>
                    <div class="service-details" style="font-size:13px; color:#64748b; margin-bottom:10px;">${escapeHtml(service.description?.substring(0, 100) || '')}</div>
                    <button class="hire-btn" onclick="openHireModal(${service.id}, ${service.provider_id}, '${escapeHtml(service.title)}')">📞 Hire Now</button>
                </div>
            `).join('');
        }
        
        function openHireModal(serviceId, providerId, serviceTitle) {
            selectedService = { serviceId, providerId, serviceTitle };
            document.getElementById('hireModal').style.display = 'flex';
            document.getElementById('hireAmount').value = '';
            document.getElementById('hireMessage').value = '';
        }
        
        async function confirmHire() {
            const amount = document.getElementById('hireAmount').value;
            const message = document.getElementById('hireMessage').value;
            if (!amount || amount <= 0) { showToast('Please enter a valid amount', 'error'); return; }
            const result = await apiCall('/api/direct-hire', { method: 'POST', body: JSON.stringify({ service_id: selectedService.serviceId, provider_id: selectedService.providerId, agreed_amount: parseFloat(amount), message: message }) });
            if (result.success) { showToast('Hire request sent successfully!', 'success'); closeModal(); }
            else { showToast(result.message || 'Failed to send hire request', 'error'); }
        }
        
        function closeModal() { document.getElementById('hireModal').style.display = 'none'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        loadCategories(); loadServices();
    </script>
</body>
</html>
