<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Service Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .navbar { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .logo { font-size: 22px; font-weight: bold; }
        .logo span { color: #00c8ff; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .filters { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filters input, .filters select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; flex: 1; }
        .filters button { padding: 10px 20px; background: #00c8ff; border: none; border-radius: 8px; cursor: pointer; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .job-card { border-left: 4px solid #f59e0b; }
        .service-card h3 { margin-bottom: 10px; }
        .price { color: #f59e0b; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 10px; }
        .badge-job { background: #fef3c7; color: #d97706; }
        .badge-service { background: #dcfce7; color: #10b981; }
        button { background: #10b981; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .bid-btn { background: #3b82f6; }
        .empty-state { text-align: center; padding: 60px; color: #666; }
        .loading { text-align: center; padding: 60px; }
        @media (max-width: 768px) { .services-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links">
            <a href="#" id="dashboardLink">Dashboard</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="chat.html">Messages</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="filters">
            <select id="categoryFilter"><option value="">All Categories</option></select>
            <input type="text" id="locationFilter" placeholder="Location">
            <button onclick="loadMarketplace()">Search</button>
        </div>
        
        <div id="marketplaceGrid" class="services-grid">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        
        if (!token) window.location.href = 'index.html';
        
        try {
            user = JSON.parse(localStorage.getItem('user'));
            const dashboardLink = document.getElementById('dashboardLink');
            dashboardLink.href = user.user_type === 'seeker' ? 'seeker-dashboard.html' : 'provider-dashboard.html';
        } catch(e) {}
        
        async function loadCategories() {
            try {
                const response = await fetch(API_URL + '/api/categories');
                const categories = await response.json();
                const select = document.getElementById('categoryFilter');
                select.innerHTML = '<option value="">All Categories</option>' + 
                    categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
            } catch(e) {}
        }
        
        async function loadMarketplace() {
            const grid = document.getElementById('marketplaceGrid');
            grid.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const response = await fetch(API_URL + '/api/services/marketplace', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const items = await response.json();
                
                console.log('Items received:', items);
                
                if (!items || items.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No services or jobs available</div>';
                    return;
                }
                
                // For providers: filter to show only their services
                let displayItems = items;
                if (user?.user_type === 'provider') {
                    displayItems = items.filter(i => i.provider_id === user.id);
                }
                
                if (displayItems.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No items to display</div>';
                    return;
                }
                
                grid.innerHTML = displayItems.map(item => {
                    const isJob = item.item_type === 'job' || (item.provider_id === null && item.price);
                    const badgeClass = isJob ? 'badge-job' : 'badge-service';
                    const badgeText = isJob ? '📋 JOB POST' : '🔧 SERVICE';
                    const btnClass = isJob ? 'bid-btn' : '';
                    const btnText = isJob ? '💰 Place Bid' : '📞 Hire Now';
                    
                    return `
                        <div class="service-card ${isJob ? 'job-card' : ''}">
                            <div class="badge ${badgeClass}">${badgeText}</div>
                            <h3>${escapeHtml(item.title)}</h3>
                            <div class="price">💰 GHS ${item.price || 'Negotiable'}</div>
                            <div>👤 ${escapeHtml(item.provider_name)}</div>
                            <div>📍 ${escapeHtml(item.provider_location || 'Location not specified')}</div>
                            <div style="margin: 10px 0; color: #666; font-size: 14px;">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                            <button class="${btnClass}" onclick="${isJob ? `placeBid(${item.id})` : `hireService(${item.id}, ${item.provider_id})`}">${btnText}</button>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error:', error);
                grid.innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
            }
        }
        
        async function placeBid(jobId) {
            const amount = prompt('Enter your bid amount (GHS):');
            if (!amount) return;
            
            const result = await fetch(API_URL + `/api/jobs/${jobId}/bids`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ amount: parseFloat(amount), estimated_days: 1 })
            });
            const data = await result.json();
            alert(data.success ? 'Bid placed!' : 'Failed to place bid');
            loadMarketplace();
        }
        
        async function hireService(serviceId, providerId) {
            const amount = prompt('Enter agreed amount (GHS):');
            if (!amount) return;
            
            const result = await fetch(API_URL + '/api/direct-hire', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ service_id: serviceId, provider_id: providerId, agreed_amount: parseFloat(amount), message: '' })
            });
            const data = await result.json();
            alert(data.success ? 'Hire request sent!' : 'Failed to send request');
            loadMarketplace();
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        loadCategories();
        loadMarketplace();
    </script>
</body>
</html>
