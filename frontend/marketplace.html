<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Marketplace | Service Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1e293b;
        }

        .navbar {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .logo span {
            color: #00c8ff;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #00c8ff, #00e8a0);
            color: #0f0c29;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .hero-section {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 24px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .hero-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .search-container {
            background: white;
            border-radius: 60px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            flex: 2;
            padding: 16px 24px;
            border: none;
            background: transparent;
            font-size: 16px;
            outline: none;
        }

        .search-select {
            padding: 16px 20px;
            border: none;
            background: #f8fafc;
            border-radius: 40px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .search-btn {
            background: linear-gradient(135deg, #f59e0b, #e67e22);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .filters-bar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-label {
            font-weight: 600;
            color: #64748b;
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            outline: none;
        }

        .price-input {
            width: 100px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2);
        }

        .service-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            color: white;
        }

        .service-category {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .service-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .service-body {
            padding: 20px;
        }

        .provider-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .provider-name {
            font-weight: 600;
        }

        .provider-rating {
            color: #f59e0b;
        }

        .service-description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .service-price {
            font-size: 24px;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 15px;
        }

        .service-price small {
            font-size: 12px;
            font-weight: normal;
            color: #64748b;
        }

        .service-location {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .hire-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .hire-btn:hover {
            opacity: 0.9;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #64748b;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            grid-column: 1/-1;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            display: none;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .search-container { flex-direction: column; border-radius: 20px; }
            .filters-bar { flex-direction: column; align-items: stretch; }
            .filter-group { justify-content: space-between; }
            .services-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links" id="navLinks">
            <!-- Dynamic navigation will be inserted here based on user type -->
        </div>
        <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="hero-section">
            <div class="hero-title">Find Trusted Service Providers</div>
            <div class="hero-subtitle">Browse through hundreds of verified professionals and hire directly</div>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="What service do you need? e.g., Plumber, Electrician...">
                <select id="categoryFilter" class="search-select">
                    <option value="">All Categories</option>
                </select>
                <button class="search-btn" onclick="searchServices()">Search →</button>
            </div>
        </div>

        <div class="filters-bar">
            <div class="filter-group">
                <span class="filter-label">📍 Location:</span>
                <select id="locationFilter" class="filter-select">
                    <option value="">All Ghana</option>
                    <option value="Accra">Accra</option>
                    <option value="Kumasi">Kumasi</option>
                    <option value="Takoradi">Takoradi</option>
                    <option value="Tema">Tema</option>
                    <option value="Cape Coast">Cape Coast</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">💰 Price Range:</span>
                <input type="number" id="minPrice" class="price-input" placeholder="Min">
                <span>-</span>
                <input type="number" id="maxPrice" class="price-input" placeholder="Max">
            </div>
            <div class="filter-group">
                <span class="filter-label">⭐ Rating:</span>
                <select id="ratingFilter" class="filter-select">
                    <option value="0">All Ratings</option>
                    <option value="4">4+ Stars</option>
                    <option value="4.5">4.5+ Stars</option>
                </select>
            </div>
            <button class="search-btn" onclick="applyFilters()" style="background:#3b82f6; padding:10px 20px;">Apply Filters</button>
        </div>

        <div id="servicesGrid" class="services-grid">
            <div class="empty-state">Loading services...</div>
        </div>
    </div>

    <div id="hireModal" class="modal">
        <div class="modal-content">
            <h3>Hire Service Provider</h3>
            <div id="hireServiceInfo"></div>
            <div class="form-group">
                <label>Your Message (Optional)</label>
                <textarea id="hireMessage" rows="4" placeholder="Describe what you need..."></textarea>
            </div>
            <div class="form-group">
                <label>Agreed Amount (GHS)</label>
                <input type="number" id="hireAmount" placeholder="Enter agreed amount">
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="confirmHire()">Confirm Hire</button>
                <button class="btn-secondary" onclick="closeModal('hireModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        let categories = [];
        let currentServices = [];
        let selectedService = null;

        if (!token) {
            window.location.href = 'index.html';
        }

        try {
            user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('userName').innerText = user?.full_name || 'User';
        } catch(e) {}

        // ==================== DYNAMIC NAVIGATION ====================
        function setupNavigation() {
            const navContainer = document.getElementById('navLinks');
            const userType = user?.user_type;
            
            if (userType === 'provider') {
                navContainer.innerHTML = `
                    <a href="#" class="nav-link" onclick="window.location.href='provider-dashboard.html'">📊 My Dashboard</a>
                    <a href="#" class="nav-link active">🛒 Marketplace</a>
                `;
            } else if (userType === 'seeker') {
                navContainer.innerHTML = `
                    <a href="#" class="nav-link" onclick="window.location.href='seeker-dashboard.html'">📋 My Dashboard</a>
                    <a href="#" class="nav-link active">🛒 Marketplace</a>
                `;
            } else {
                navContainer.innerHTML = `
                    <a href="#" class="nav-link" onclick="window.location.href='dashboard.html'">📊 Dashboard</a>
                    <a href="#" class="nav-link active">🛒 Marketplace</a>
                `;
            }
        }

        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });
            return response.json();
        }

        async function loadCategories() {
            categories = await apiCall('/api/categories');
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="">All Categories</option>' + 
                categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
        }

        async function searchServices() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            
            let url = `/api/services/marketplace?`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (category) url += `&category=${category}`;
            if (location) url += `&location=${encodeURIComponent(location)}`;
            if (minPrice) url += `&min_price=${minPrice}`;
            if (maxPrice) url += `&max_price=${maxPrice}`;
            
            const services = await apiCall(url);
            currentServices = services;
            displayServices(services);
        }

        async function applyFilters() {
            await searchServices();
        }

        function displayServices(services) {
            const container = document.getElementById('servicesGrid');
            
            if (!services || services.length === 0) {
                container.innerHTML = '<div class="empty-state">🔍 No services found. Try adjusting your search or filters.</div>';
                return;
            }
            
            const ratingFilter = parseFloat(document.getElementById('ratingFilter').value);
            let filtered = services;
            if (ratingFilter > 0) {
                filtered = services.filter(s => (s.provider_rating || 0) >= ratingFilter);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">⭐ No services match your rating criteria. Try lowering the rating filter.</div>';
                return;
            }
            
            container.innerHTML = filtered.map(service => `
                <div class="service-card">
                    <div class="service-header">
                        <span class="service-category">${service.category_icon || '🔧'} ${service.category_name}</span>
                        <div class="service-title">${escapeHtml(service.title)}</div>
                    </div>
                    <div class="service-body">
                        <div class="provider-info">
                            <span class="provider-name">${escapeHtml(service.provider_name)}</span>
                            <span class="provider-rating">⭐ ${service.provider_rating || 'New'} (${service.provider_reviews || 0} reviews)</span>
                        </div>
                        <div class="service-description">${escapeHtml(service.description || 'No description provided').substring(0, 120)}${service.description?.length > 120 ? '...' : ''}</div>
                        <div class="service-price">
                            GHS ${service.price || 'Negotiable'} 
                            <small>${service.price_type === 'hourly' ? '/hour' : service.price_type === 'fixed' ? 'fixed' : 'negotiable'}</small>
                        </div>
                        <div class="service-location">
                            <i class="fas fa-map-marker-alt"></i> ${service.provider_location || 'Ghana'}
                        </div>
                        <div class="service-location">
                            <i class="fas fa-briefcase"></i> ${service.experience_years || 0} years experience
                        </div>
                        ${user?.user_type === 'seeker' ? `<button class="hire-btn" onclick="openHireModal(${JSON.stringify(service).replace(/"/g, '&quot;')})">Hire Now →</button>` : 
                        user?.user_type === 'provider' ? `<div class="service-location" style="color:#10b981;">✅ You are a provider. Customers can hire you!</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function openHireModal(service) {
            if (user?.user_type !== 'seeker') {
                showToast('Only customers can hire providers', 'error');
                return;
            }
            selectedService = service;
            document.getElementById('hireServiceInfo').innerHTML = `
                <div style="background:#f8fafc; padding:15px; border-radius:12px; margin-bottom:15px;">
                    <strong>${escapeHtml(service.title)}</strong><br>
                    Provider: ${escapeHtml(service.provider_name)}<br>
                    Rate: GHS ${service.price || 'Negotiable'} ${service.price_type === 'hourly' ? '/hour' : ''}
                </div>
            `;
            document.getElementById('hireAmount').value = service.price || '';
            document.getElementById('hireMessage').value = '';
            document.getElementById('hireModal').style.display = 'flex';
        }

        async function confirmHire() {
            if (!selectedService) return;
            
            const message = document.getElementById('hireMessage').value;
            const amount = document.getElementById('hireAmount').value;
            
            if (!amount || amount <= 0) {
                showToast('Please enter a valid amount', 'error');
                return;
            }
            
            const result = await apiCall('/api/direct-hire', {
                method: 'POST',
                body: JSON.stringify({
                    service_id: selectedService.id,
                    provider_id: selectedService.provider_id,
                    message: message,
                    agreed_amount: parseFloat(amount)
                })
            });
            
            if (result.success) {
                showToast('Hire request sent! The provider will contact you shortly.', 'success');
                closeModal('hireModal');
            } else {
                showToast(result.message || 'Failed to send hire request', 'error');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
        }

        // Initialize
        setupNavigation();
        loadCategories();
        searchServices();
    </script>
</body>
</html>
