<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Service Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1e293b; }
        
        .navbar { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .logo { font-size: 24px; font-weight: 800; }
        .logo span { color: #00e8a0; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .nav-link.active { background: linear-gradient(135deg, #00c8ff, #00e8a0); color: #0f0c29; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        
        .filters { background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-select, .filter-input { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 12px; flex: 1; min-width: 150px; }
        .search-btn { background: linear-gradient(135deg, #00c8ff, #00e8a0); border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 20px; padding: 20px; transition: transform 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .service-card:hover { transform: translateY(-3px); }
        .job-card { border: 2px solid #f59e0b; background: #fffbeb; }
        
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; margin-bottom: 10px; }
        .badge-job { background: #fef3c7; color: #d97706; }
        .badge-service { background: #dbeafe; color: #2563eb; }
        .badge-your { background: #e9d5ff; color: #7c3aed; }
        
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .price { font-weight: 700; color: #f59e0b; font-size: 20px; margin: 10px 0; }
        .description { color: #64748b; font-size: 14px; margin: 10px 0; }
        
        .btn-hire, .btn-bid { width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; }
        .btn-hire { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-bid { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .profile-link { display: block; margin-top: 10px; color: #8b5cf6; text-align: center; font-size: 13px; text-decoration: none; }
        
        .empty-state { text-align: center; padding: 60px; color: #94a3b8; }
        .loading { text-align: center; padding: 60px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; cursor: pointer; border: none; font-weight: 600; }
        .btn-submit { background: #10b981; color: white; }
        .btn-cancel { background: #e2e8f0; color: #333; }
        
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; display: none; z-index: 1000; }
        .toast.error { background: #ef4444; }
        
        @media (max-width: 768px) { .navbar { flex-direction: column; text-align: center; } .services-grid { grid-template-columns: 1fr; } .filters { flex-direction: column; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links">
            <a href="#" id="dashboardLink" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link active">Marketplace</a>
            <a href="chat.html" class="nav-link">Messages</a>
        </div>
        <div class="user-info">
            <span id="userName">User</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="filters">
            <select id="categoryFilter" class="filter-select"><option value="">All Categories</option></select>
            <input type="text" id="locationFilter" class="filter-input" placeholder="Location">
            <input type="number" id="minPrice" class="filter-input" placeholder="Min Price">
            <input type="number" id="maxPrice" class="filter-input" placeholder="Max Price">
            <button class="search-btn" onclick="loadServices()">Search</button>
        </div>
        
        <div id="servicesGrid" class="services-grid">
            <div class="loading">Loading services...</div>
        </div>
    </div>

    <!-- Hire Modal -->
    <div id="hireModal" class="modal">
        <div class="modal-content">
            <h3>Hire Provider</h3>
            <input type="number" id="hireAmount" placeholder="Agreed Amount (GHS)">
            <textarea id="hireMessage" rows="3" placeholder="Message to provider..."></textarea>
            <div class="modal-buttons">
                <button class="btn-submit" onclick="confirmHire()">Send Request</button>
                <button class="btn-cancel" onclick="closeHireModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Bid Modal -->
    <div id="bidModal" class="modal">
        <div class="modal-content">
            <h3>Place Bid on Job</h3>
            <input type="number" id="bidAmount" placeholder="Your bid amount (GHS)">
            <input type="number" id="bidDays" placeholder="Estimated days">
            <textarea id="bidMessage" rows="3" placeholder="Message to client..."></textarea>
            <div class="modal-buttons">
                <button class="btn-submit" onclick="confirmBid()">Submit Bid</button>
                <button class="btn-cancel" onclick="closeBidModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        let selectedService = null;
        let currentJobId = null;
        
        if (!token) {
            window.location.href = 'index.html';
        }
        
        try { 
            user = JSON.parse(localStorage.getItem('user')); 
            document.getElementById('userName').innerText = user?.full_name || 'User';
            
            const dashboardLink = document.getElementById('dashboardLink');
            if (user?.user_type === 'seeker') {
                dashboardLink.href = 'seeker-dashboard.html';
            } else if (user?.user_type === 'provider') {
                dashboardLink.href = 'provider-dashboard.html';
            } else {
                dashboardLink.href = 'admin-dashboard.html';
            }
        } catch(e) {
            console.error('Error parsing user:', e);
        }
        
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });
            return response.json();
        }
        
        async function loadCategories() {
            try {
                const categories = await apiCall('/api/categories');
                const select = document.getElementById('categoryFilter');
                if (categories && categories.length > 0) {
                    select.innerHTML = '<option value="">All Categories</option>' + categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        async function loadServices() {
            const container = document.getElementById('servicesGrid');
            container.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const items = await apiCall('/api/services/marketplace');
                console.log('Marketplace items:', items);
                
                if (!items || items.length === 0) {
                    container.innerHTML = '<div class="empty-state">No services or jobs available.</div>';
                    return;
                }
                
                // Apply filters
                let filtered = [...items];
                const category = document.getElementById('categoryFilter').value;
                const location = document.getElementById('locationFilter').value;
                const minPrice = document.getElementById('minPrice').value;
                const maxPrice = document.getElementById('maxPrice').value;
                
                if (category) filtered = filtered.filter(i => i.category_id == category);
                if (location) filtered = filtered.filter(i => (i.provider_location || '').toLowerCase().includes(location.toLowerCase()));
                if (minPrice) filtered = filtered.filter(i => parseFloat(i.price) >= parseFloat(minPrice));
                if (maxPrice) filtered = filtered.filter(i => parseFloat(i.price) <= parseFloat(maxPrice));
                
                // PROVIDER VIEW - only their own services
                if (user?.user_type === 'provider') {
                    const myItems = filtered.filter(i => i.provider_id === user.id && i.item_type !== 'job');
                    
                    if (myItems.length === 0) {
                        container.innerHTML = '<div class="empty-state">You haven\'t added any services yet.</div>';
                        return;
                    }
                    
                    container.innerHTML = myItems.map(item => `
                        <div class="service-card">
                            <div class="badge badge-your">YOUR SERVICE</div>
                            <div class="card-title">${escapeHtml(item.title)}</div>
                            <div class="price">GHS ${item.price || 'Negotiable'}</div>
                            <div class="description">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                            <a href="provider-profile.html?id=${user.id}" class="profile-link">View My Profile →</a>
                        </div>
                    `).join('');
                    return;
                }
                
                // SEEKER VIEW - show everything
                const jobs = filtered.filter(i => i.item_type === 'job');
                const services = filtered.filter(i => i.item_type === 'service');
                
                if (jobs.length === 0 && services.length === 0) {
                    container.innerHTML = '<div class="empty-state">No results found.</div>';
                    return;
                }
                
                const allItems = [...jobs, ...services];
                
                container.innerHTML = allItems.map(item => {
                    if (item.item_type === 'job') {
                        return `
                            <div class="service-card job-card">
                                <div class="badge badge-job">JOB POST</div>
                                <div class="card-title">${escapeHtml(item.title)}</div>
                                <div class="price">Budget: GHS ${item.price || 'Negotiable'}</div>
                                <div class="description">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                                <button class="btn-bid" onclick="openBidModal(${item.id})">Place Bid</button>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="service-card">
                                <div class="badge badge-service">SERVICE</div>
                                <div class="card-title">${escapeHtml(item.title)}</div>
                                <div class="price">GHS ${item.price || 'Negotiable'}</div>
                                <div class="description">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                                <button class="btn-hire" onclick="openHireModal(${item.id}, ${item.provider_id})">Hire Now</button>
                                <a href="provider-profile.html?id=${item.provider_id}" class="profile-link">View Profile →</a>
                            </div>
                        `;
                    }
                }).join('');
                
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<div class="empty-state">Error loading. Please refresh.</div>';
            }
        }
        
        // Hire functions
        function openHireModal(serviceId, providerId) {
            selectedService = { serviceId, providerId };
            document.getElementById('hireModal').style.display = 'flex';
            document.getElementById('hireAmount').value = '';
            document.getElementById('hireMessage').value = '';
        }
        
        function closeHireModal() {
            document.getElementById('hireModal').style.display = 'none';
            selectedService = null;
        }
        
        async function confirmHire() {
            const amount = document.getElementById('hireAmount').value;
            const message = document.getElementById('hireMessage').value;
            
            if (!amount || amount <= 0) {
                showToast('Please enter a valid amount', 'error');
                return;
            }
            
            const result = await apiCall('/api/direct-hire', {
                method: 'POST',
                body: JSON.stringify({
                    service_id: selectedService.serviceId,
                    provider_id: selectedService.providerId,
                    agreed_amount: parseFloat(amount),
                    message: message
                })
            });
            
            if (result.success) {
                showToast('Hire request sent!', 'success');
                closeHireModal();
            } else {
                showToast(result.message || 'Failed', 'error');
            }
        }
        
        // Bid functions
        function openBidModal(jobId) {
            currentJobId = jobId;
            document.getElementById('bidModal').style.display = 'flex';
            document.getElementById('bidAmount').value = '';
            document.getElementById('bidDays').value = '';
            document.getElementById('bidMessage').value = '';
        }
        
        function closeBidModal() {
            document.getElementById('bidModal').style.display = 'none';
            currentJobId = null;
        }
        
        async function confirmBid() {
            const amount = document.getElementById('bidAmount').value;
            const days = document.getElementById('bidDays').value;
            const message = document.getElementById('bidMessage').value;
            
            if (!amount || amount <= 0) {
                showToast('Please enter a valid bid amount', 'error');
                return;
            }
            
            const result = await apiCall(`/api/jobs/${currentJobId}/bids`, {
                method: 'POST',
                body: JSON.stringify({
                    amount: parseFloat(amount),
                    estimated_days: days || 1,
                    message: message
                })
            });
            
            if (result.success) {
                showToast('Bid placed successfully!', 'success');
                closeBidModal();
            } else {
                showToast(result.message || 'Failed', 'error');
            }
        }
        
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Initialize
        loadCategories();
        loadServices();
        
        // Refresh every 30 seconds
        setInterval(loadServices, 30000);
    </script>
</body>
</html>
