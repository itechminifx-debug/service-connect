<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Service Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1e293b; }
        .navbar { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .logo { font-size: 24px; font-weight: 800; }
        .logo span { color: #00e8a0; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
        .nav-link.active { background: linear-gradient(135deg, #00c8ff, #00e8a0); color: #0f0c29; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .filters { background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; }
        .filter-select, .filter-input { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 12px; flex: 1; min-width: 150px; }
        .search-btn { background: linear-gradient(135deg, #00c8ff, #00e8a0); border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 20px; padding: 20px; transition: transform 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .service-card:hover { transform: translateY(-3px); }
        .job-card { border: 2px solid #f59e0b; background: #fffbeb; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; margin-bottom: 10px; }
        .badge-job { background: #fef3c7; color: #d97706; }
        .badge-service { background: #dbeafe; color: #2563eb; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .price { font-weight: 700; color: #f59e0b; font-size: 20px; margin: 10px 0; }
        .btn-hire, .btn-bid { width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; }
        .btn-hire { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-bid { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .debug-info { background: #1e293b; color: #00e8a0; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-family: monospace; font-size: 12px; display: none; }
        .empty-state { text-align: center; padding: 60px; color: #94a3b8; }
        .loading { text-align: center; padding: 60px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; display: none; z-index: 1000; }
        @media (max-width: 768px) { .navbar { flex-direction: column; } .services-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Service<span>Connect</span></div>
        <div class="nav-links">
            <a href="#" id="dashboardLink" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link active">Marketplace</a>
            <a href="chat.html" class="nav-link">Messages</a>
        </div>
        <div class="user-info">
            <span id="userName">User</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="filters">
            <select id="categoryFilter" class="filter-select"><option value="">All Categories</option></select>
            <input type="text" id="locationFilter" class="filter-input" placeholder="Location">
            <input type="number" id="minPrice" class="filter-input" placeholder="Min Price">
            <input type="number" id="maxPrice" class="filter-input" placeholder="Max Price">
            <button class="search-btn" onclick="loadServices()">🔍 Search</button>
        </div>
        
        <!-- Debug Info Box - Shows what's happening -->
        <div id="debugBox" class="debug-info"></div>
        
        <div id="servicesGrid" class="services-grid">
            <div class="loading">Loading services...</div>
        </div>
    </div>

    <!-- Hire Modal -->
    <div id="hireModal" class="modal">
        <div class="modal-content">
            <h3>📝 Hire Provider</h3>
            <input type="number" id="hireAmount" placeholder="Agreed Amount (GHS)">
            <textarea id="hireMessage" rows="3" placeholder="Message..."></textarea>
            <button class="btn-hire" onclick="confirmHire()" style="margin-top:0;">Send Request</button>
            <button onclick="closeHireModal()" style="margin-top:10px; width:100%; padding:12px; background:#e2e8f0; border:none; border-radius:12px;">Cancel</button>
        </div>
    </div>

    <!-- Bid Modal -->
    <div id="bidModal" class="modal">
        <div class="modal-content">
            <h3>💰 Place Bid</h3>
            <input type="number" id="bidAmount" placeholder="Your bid amount (GHS)">
            <input type="number" id="bidDays" placeholder="Estimated days">
            <textarea id="bidMessage" rows="3" placeholder="Message..."></textarea>
            <button class="btn-bid" onclick="confirmBid()" style="margin-top:0;">Submit Bid</button>
            <button onclick="closeBidModal()" style="margin-top:10px; width:100%; padding:12px; background:#e2e8f0; border:none; border-radius:12px;">Cancel</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let user = null;
        let selectedService = null;
        let currentJobId = null;
        
        if (!token) window.location.href = 'index.html';
        
        try { 
            user = JSON.parse(localStorage.getItem('user')); 
            document.getElementById('userName').innerText = user?.full_name || 'User';
            const dashboardLink = document.getElementById('dashboardLink');
            if (user?.user_type === 'seeker') dashboardLink.href = 'seeker-dashboard.html';
            else if (user?.user_type === 'provider') dashboardLink.href = 'provider-dashboard.html';
            else dashboardLink.href = 'admin-dashboard.html';
        } catch(e) {}
        
        function showDebug(message, isError = false) {
            const debugBox = document.getElementById('debugBox');
            debugBox.style.display = 'block';
            debugBox.style.background = isError ? '#450a0a' : '#1e293b';
            debugBox.innerHTML = `<i class="fas fa-bug"></i> ${message}`;
            setTimeout(() => { debugBox.style.display = 'none'; }, 5000);
        }
        
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers } });
            return response.json();
        }
        
        async function loadCategories() {
            try {
                const categories = await apiCall('/api/categories');
                const select = document.getElementById('categoryFilter');
                if (categories && categories.length > 0) {
                    select.innerHTML = '<option value="">All Categories</option>' + categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        async function loadServices() {
            const container = document.getElementById('servicesGrid');
            container.innerHTML = '<div class="loading">Loading services...</div>';
            showDebug('Fetching data from server...');
            
            try {
                const items = await apiCall('/api/services/marketplace');
                
                // Show debug info on page
                if (!items) {
                    showDebug('❌ No response from server', true);
                    container.innerHTML = '<div class="empty-state">No response from server. Please refresh.</div>';
                    return;
                }
                
                const serviceCount = items.filter(i => i.type === 'service').length;
                const jobCount = items.filter(i => i.type === 'job').length;
                showDebug(`✅ Found ${items.length} total items (${serviceCount} services, ${jobCount} jobs)`);
                
                if (items.length === 0) {
                    container.innerHTML = '<div class="empty-state">No services or jobs available.</div>';
                    return;
                }
                
                // Apply filters
                let filteredItems = [...items];
                const category = document.getElementById('categoryFilter').value;
                const location = document.getElementById('locationFilter').value;
                const minPrice = document.getElementById('minPrice').value;
                const maxPrice = document.getElementById('maxPrice').value;
                
                if (category) filteredItems = filteredItems.filter(i => i.category_id == category);
                if (location) filteredItems = filteredItems.filter(i => (i.provider_location || '').toLowerCase().includes(location.toLowerCase()));
                if (minPrice) filteredItems = filteredItems.filter(i => parseFloat(i.price) >= parseFloat(minPrice));
                if (maxPrice) filteredItems = filteredItems.filter(i => parseFloat(i.price) <= parseFloat(maxPrice));
                
                // PROVIDER VIEW - Only their own services
                if (user?.user_type === 'provider') {
                    const myItems = filteredItems.filter(i => i.provider_id === user.id && i.type !== 'job');
                    
                    if (myItems.length === 0) {
                        container.innerHTML = '<div class="empty-state">You haven\'t added any services yet.</div>';
                        return;
                    }
                    
                    container.innerHTML = myItems.map(item => `
                        <div class="service-card">
                            <div class="badge" style="background:#e9d5ff; color:#7c3aed;">YOUR SERVICE</div>
                            <div class="card-title">${escapeHtml(item.title)}</div>
                            <div class="price">💰 GHS ${item.price || 'Negotiable'}</div>
                            <div class="description">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                            <a href="provider-profile.html?id=${user.id}" style="display:block; margin-top:10px; color:#8b5cf6; text-align:center;">View My Profile →</a>
                        </div>
                    `).join('');
                    return;
                }
                
                // SEEKER VIEW - Show everything
                const services = filteredItems.filter(i => i.type === 'service');
                const jobs = filteredItems.filter(i => i.type === 'job');
                
                if (services.length === 0 && jobs.length === 0) {
                    container.innerHTML = '<div class="empty-state">No results found. Try different filters!</div>';
                    return;
                }
                
                const allItems = [...jobs, ...services];
                
                container.innerHTML = allItems.map(item => {
                    if (item.type === 'job') {
                        return `
                            <div class="service-card job-card">
                                <div class="badge badge-job">📋 JOB POST</div>
                                <div class="card-title">${escapeHtml(item.title)}</div>
                                <div class="provider-name" style="color:#64748b; font-size:14px;">🏢 Provider: ${escapeHtml(item.provider_name)}</div>
                                <div class="price">💰 Budget: GHS ${item.price || 'Negotiable'}</div>
                                <div class="description">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                                <button class="btn-bid" onclick="openBidModal(${item.id})">💰 Place Bid</button>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="service-card">
                                <div class="badge badge-service">🔧 SERVICE</div>
                                <div class="card-title">${escapeHtml(item.title)}</div>
                                <div class="provider-name" style="color:#64748b; font-size:14px;">
                                    👤 <a href="provider-profile.html?id=${item.provider_id}" style="color:#8b5cf6;">${escapeHtml(item.provider_name)}</a>
                                </div>
                                <div class="price">💰 GHS ${item.price || 'Negotiable'}</div>
                                <div class="description">${escapeHtml(item.description?.substring(0, 100) || '')}</div>
                                <button class="btn-hire" onclick="openHireModal(${item.id}, ${item.provider_id})">📞 Hire Now</button>
                                <a href="provider-profile.html?id=${item.provider_id}" style="display:block; margin-top:10px; color:#8b5cf6; text-align:center; font-size:13px;">View Profile →</a>
                            </div>
                        `;
                    }
                }).join('');
                
            } catch (error) {
                console.error('Error:', error);
                showDebug(`❌ Error: ${error.message}`, true);
                container.innerHTML = '<div class="empty-state">Error loading content. Please refresh.</div>';
            }
        }
        
        // Hire Service
        function openHireModal(serviceId, providerId) {
            selectedService = { serviceId, providerId };
            document.getElementById('hireModal').style.display = 'flex';
        }
        function closeHireModal() { document.getElementById('hireModal').style.display = 'none'; }
        
        async function confirmHire() {
            const amount = document.getElementById('hireAmount').value;
            if (!amount) { showToast('Enter amount', 'error'); return; }
            const result = await apiCall('/api/direct-hire', {
                method: 'POST',
                body: JSON.stringify({
                    service_id: selectedService.serviceId,
                    provider_id: selectedService.providerId,
                    agreed_amount: parseFloat(amount),
                    message: document.getElementById('hireMessage').value
                })
            });
            if (result.success) { showToast('Hire request sent!', 'success'); closeHireModal(); }
            else { showToast(result.message || 'Failed', 'error'); }
        }
        
        // Bid on Job
        function openBidModal(jobId) { currentJobId = jobId; document.getElementById('bidModal').style.display = 'flex'; }
        function closeBidModal() { document.getElementById('bidModal').style.display = 'none'; }
        
        async function confirmBid() {
            const amount = document.getElementById('bidAmount').value;
            if (!amount) { showToast('Enter bid amount', 'error'); return; }
            const result = await apiCall(`/api/jobs/${currentJobId}/bids`, {
                method: 'POST',
                body: JSON.stringify({
                    amount: parseFloat(amount),
                    estimated_days: document.getElementById('bidDays').value || 1,
                    message: document.getElementById('bidMessage').value
                })
            });
            if (result.success) { showToast('Bid placed!', 'success'); closeBidModal(); }
            else { showToast(result.message || 'Failed', 'error'); }
        }
        
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
        
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        loadCategories();
        loadServices();
        setInterval(loadServices, 30000);
    </script>
</body>
</html>
